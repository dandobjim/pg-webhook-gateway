services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webhooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhooks}
      POSTGRES_DB: ${POSTGRES_DB:-webhooks}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps PGDATA in /var/lib/postgresql/18/docker, so mount the
      # parent directory (not /var/lib/postgresql/data as in older images).
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
